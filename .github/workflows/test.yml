name: PostgreSQL integration tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: clinic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U clinic -d clinic_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/clinic_test
          TEST_DB_USER: clinic
          TEST_DB_PASSWORD: integration-only
