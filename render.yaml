# Free web service; supply credentials for an external free PostgreSQL database.
# No Render database is provisioned. See README for Neon Free setup.
services:
  - type: web
    name: koya-clinic
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: 'true'
